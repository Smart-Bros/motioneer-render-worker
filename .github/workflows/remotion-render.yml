name: Motioneer Cloud Render Engine

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Batch ID to render'
        required: true
        type: string
      render_ids:
        description: 'Comma-separated Render IDs'
        required: false
        type: string

jobs:
  render-batch:
    name: Motioneer Render Engine Worker
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify & Setup System Libraries & Fonts
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji fonts-liberation fonts-freefont-ttf
          else
            sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji fonts-liberation fonts-freefont-ttf || true
          fi

      - name: Cache Node Modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            render-worker/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package.json', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Pre-Built Remotion Bundle
        id: cache-bundle
        uses: actions/cache@v4
        with:
          path: /tmp/remotion-bundle
          key: ${{ runner.os }}-remotion-bundle-${{ hashFiles('remotion/**/*', 'lib/**/*') }}
          restore-keys: |
            ${{ runner.os }}-remotion-bundle-

      - name: Install Node Dependencies
        run: |
          if [ -f "render-worker/package.json" ]; then
            cd render-worker && npm install --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Run Motioneer Render Engine CLI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          REMOTION_CHROME_EXECUTABLE: /usr/bin/google-chrome
          CHROMIUM_PATH: /usr/bin/google-chrome
          REMOTION_BUNDLE_CACHE_DIR: /tmp/remotion-bundle
        run: |
          if [ -f "render-worker/batch-cli.ts" ]; then
            npx ts-node --transpile-only render-worker/batch-cli.ts --batch-id "${{ github.event.inputs.batch_id }}" --render-ids "${{ github.event.inputs.render_ids }}"
          else
            npx ts-node --transpile-only batch-cli.ts --batch-id "${{ github.event.inputs.batch_id }}" --render-ids "${{ github.event.inputs.render_ids }}"
          fi
